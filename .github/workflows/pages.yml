# Publica la app en GitHub Pages en cada push a main.
#
# Cada publicación queda con su registro en la pestaña Actions, que es donde
# se mira cuando algo no sale. Antes no había dónde mirar.
#
# Pages se activa UNA VEZ a mano, en Settings → Pages → Source: GitHub Actions.
# Este flujo intentó encenderlo solo (enablement: true) y GitHub se lo negó:
# "Resource not accessible by integration". Por defecto el token de un flujo
# es de solo lectura, y crear un sitio de Pages es escritura.

name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si entran dos pushes seguidos, que no se pisen entre ellos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # La app son archivos estáticos: se sube el repo tal cual, sin compilar.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicacion
        uses: actions/deploy-pages@v4
