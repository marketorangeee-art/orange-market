# Publica la app en GitHub Pages en cada push a main.
#
# Enciende Pages por su cuenta (enablement: true), así no depende de que
# alguien acierte con la pantalla de Settings. Y cada publicación queda con su
# registro en la pestaña Actions, que es donde se mira cuando algo no sale.

name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si entran dos pushes seguidos, que no se pisen entre ellos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # La app son archivos estáticos: se sube el repo tal cual, sin compilar.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicacion
        uses: actions/deploy-pages@v4
